    Research Experience:
      - company: BRAC University
        position: Undergraduate Thesis Researcher
        location: Dhaka, Bangladesh
        start_date: 2023-01
        end_date: 2023-12
        summary: "Context and Semantic Aware Intelligent Reference Validation Method for Detecting Hallucinated and Dangling References in Scholarly Publications."
        highlights:
          - Conducted undergraduate thesis research under the supervision of Dr. Md. Golam Rabiul Alam and Dr. Farig Yousuf Sadeque.
          - Developed a context- and semantics-aware NLP framework for detecting hallucinated and dangling references in scholarly publications.
          - Proposed an end-to-end reference validation pipeline using sentence embeddings, topic modeling, and a custom similarity algorithm.
          - Constructed and annotated citation data collected from IEEE Xplore and PubPeer.
          - Applied expert review and cross-validation for dataset quality control.
          - Addressed class imbalance using AI-generated and manually crafted synthetic samples to improve model robustness.
          - Research is being prepared for submission to PLOS ONE.

      - company: BRAC University
        position: Undergraduate Researcher
        location: Dhaka, Bangladesh
        start_date: 2023-05
        end_date: 2023-12
        summary: "Hotel Review Analysis on Machine Learning and Deep Learning Based on Pre-trained GloVe Embedding."
        highlights:
          - Completed the undergraduate research project for CSE431 under the supervision of Annajiat Alim Rasel.
          - Developed a sentiment-based lodging recommendation system using user reviews and pre-trained GloVe word embeddings.
          - Conducted data preprocessing and feature extraction for model training.
          - Evaluated multiple machine learning and deep learning approaches.
          - Achieved the strongest performance using an RNN-LSTM architecture for capturing textual patterns.

